name: Update profile art

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"
  schedule:
    - cron: "17 * * * *"   # refresh hourly at off-peak minute

permissions:
  contents: write

jobs:
  heatmap:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
        continue-on-error: true
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/fetch_leetcode.py
        continue-on-error: true
      - run: python scripts/render_leetcode_svg.py
      - run: python scripts/render_leetcode_badges_svg.py
      - run: python scripts/render_streak_cards.py
      - run: python scripts/make_hackathons_card.py
      - run: python scripts/make_highlights_card.py
      - run: python scripts/make_languages_card.py
      - run: python scripts/make_info_card.py
      - run: python scripts/make_footer_card.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: "data/contributions.json contrib-heatmap.svg streak-card.svg languages-card.svg footer-card.svg data/leetcode.json leetcode-card.svg leetcode-badges.svg leetcode-streak.svg hackathons-card.svg highlights-card.svg info-card.svg"
