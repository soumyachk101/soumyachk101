<svg viewBox="0 0 1200 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <title>minimalist dark divider</title>
  <defs>
    <!-- Base track gradient -->
    <linearGradient id="baseTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="15%" stop-color="#30363d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#30363d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle monochrome traveling light beam -->
    <linearGradient id="softBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="dividerClip">
      <rect x="0" y="0" width="1200" height="16"/>
    </clipPath>
  </defs>

  <!-- Razor-sharp 1px baseline -->
  <line x1="60" y1="8" x2="1140" y2="8" stroke="url(#baseTrack)" stroke-width="1"/>

  <!-- Subtle traveling light glint -->
  <g clip-path="url(#dividerClip)">
    <rect x="0" y="7.5" width="180" height="1" fill="url(#softBeam)">
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="1220 0" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </rect>
  </g>

  <!-- Center minimalist terminal node -->
  <rect x="594" y="5.5" width="12" height="5" rx="2.5" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
  <circle cx="600" cy="8" r="1.5" fill="#8b949e"/>
</svg>
