<svg viewBox="0 0 1200 16" xmlns="http://www.w3.org/2000/svg">
  <title>cyber laser divider</title>
  <defs>
    <!-- Base track gradient -->
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#30363d" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#30363d" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#30363d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>

    <!-- Cute multi-color beam gradient -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="25%" stop-color="#39d353" stop-opacity="0.6"/>
      <stop offset="48%" stop-color="#56d4dd" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="52%" stop-color="#58a6ff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#bc8cff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>

    <!-- Laser bloom glow filter -->
    <filter id="bloom" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="dividerClip">
      <rect x="0" y="0" width="1200" height="16"/>
    </clipPath>
  </defs>

  <!-- Base razor-sharp laser line -->
  <rect x="0" y="7.25" width="1200" height="1.5" fill="url(#base)"/>

  <!-- Traveling multi-color laser pulse beam with bloom glow -->
  <g clip-path="url(#dividerClip)">
    <g>
      <rect x="0" y="6.5" width="220" height="3" rx="1.5" fill="url(#beam)" filter="url(#bloom)"/>
      <animateTransform attributeName="transform" type="translate" from="-240 0" to="1240 0" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </g>
  </g>

  <!-- Center cyber diamond node with color-shifting stroke -->
  <rect x="595.5" y="3.5" width="9" height="9" transform="rotate(45 600 8)" fill="#0d1117" stroke="#39d353" stroke-width="1.2">
    <animate attributeName="stroke" values="#39d353;#56d4dd;#58a6ff;#bc8cff;#39d353" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="8" r="1.5" fill="#56d4dd">
    <animate attributeName="fill" values="#56d4dd;#58a6ff;#bc8cff;#39d353;#56d4dd" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Cute glowing traveling orb like the info card -->
  <circle cy="8" r="4" fill="#39d353" filter="url(#bloom)">
    <animate attributeName="cx" values="40;1160;40" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <animate attributeName="fill" values="#39d353;#56d4dd;#58a6ff;#bc8cff;#39d353" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.2;4.8;3.2" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
