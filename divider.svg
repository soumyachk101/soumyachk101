<svg xmlns="http://www.w3.org/2000/svg" width="860" height="22" viewBox="0 0 860 22"
     role="img" aria-label="section divider">
  <title>Cinematic section divider</title>
  <defs>
    <linearGradient id="gRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a34" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#2a2a34"/>
      <stop offset="0.85" stop-color="#2a2a34"/>
      <stop offset="1" stop-color="#2a2a34" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gGoldRun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8a63f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2d489"/>
      <stop offset="1" stop-color="#d8a63f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gCrimRun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b03a45" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4606c"/>
      <stop offset="1" stop-color="#b03a45" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="11" x2="860" y2="11" stroke="url(#gRule)" stroke-width="1"/>

  <!-- two slow opposing sheens: gold (LTR) + crimson (RTL) -->
  <g>
    <rect x="-160" y="10.4" width="160" height="1.2" fill="url(#gGoldRun)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1020 0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </rect>
    <rect x="860" y="10.4" width="160" height="1.2" fill="url(#gCrimRun)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1020 0" dur="5.5s" begin="-2.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </rect>
  </g>

  <!-- center node: a small diamond, gold with a faint crimson core -->
  <g transform="translate(430 11)">
    <rect x="-4.5" y="-4.5" width="9" height="9" transform="rotate(45)" fill="#14141b" stroke="#d8a63f" stroke-width="1"/>
    <circle r="1.6" fill="#b03a45">
      <animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
