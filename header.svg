<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="50%" stop-color="#0c1628"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>

    <!-- Name text gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020817" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter for name -->
    <filter id="nameGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for grid -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bgGrad)"/>

  <!-- Subtle grid texture -->
  <g opacity="0.07" filter="url(#softBlur)">
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="160" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="160" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="160" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="160" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="160" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="160" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="160" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="160" stroke="#38bdf8" stroke-width="0.5"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="40" x2="900" y2="40" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#38bdf8" stroke-width="0.5"/>
  </g>

  <!-- Diagonal accent lines top-left -->
  <g opacity="0.12">
    <line x1="0" y1="0" x2="120" y2="160" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="30" y1="0" x2="150" y2="160" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="180" y2="160" stroke="#7c3aed" stroke-width="0.5"/>
  </g>

  <!-- Diagonal accent lines bottom-right -->
  <g opacity="0.12">
    <line x1="780" y1="0" x2="900" y2="80" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="810" y1="0" x2="900" y2="60" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="840" y1="0" x2="900" y2="40" stroke="#7c3aed" stroke-width="0.5"/>
  </g>

  <!-- Accent dot cluster left -->
  <g opacity="0.5">
    <circle cx="48" cy="45" r="1.5" fill="#38bdf8"/>
    <circle cx="58" cy="55" r="1" fill="#38bdf8"/>
    <circle cx="38" cy="60" r="1" fill="#7c3aed"/>
    <circle cx="68" cy="42" r="1.2" fill="#38bdf8"/>
  </g>

  <!-- Accent dot cluster right -->
  <g opacity="0.5">
    <circle cx="852" cy="45" r="1.5" fill="#38bdf8"/>
    <circle cx="862" cy="58" r="1" fill="#7c3aed"/>
    <circle cx="842" cy="60" r="1" fill="#38bdf8"/>
    <circle cx="872" cy="42" r="1.2" fill="#38bdf8"/>
  </g>

  <!-- Left bracket decoration -->
  <g opacity="0.35" stroke="#38bdf8" fill="none" stroke-width="1.2">
    <polyline points="75,55 62,55 62,105 75,105"/>
  </g>

  <!-- Right bracket decoration -->
  <g opacity="0.35" stroke="#38bdf8" fill="none" stroke-width="1.2">
    <polyline points="825,55 838,55 838,105 825,105"/>
  </g>

  <!-- Horizontal accent line (top) -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#lineGrad)"/>

  <!-- Main name — glow layer -->
  <text
    x="450" y="86"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Segoe UI', -apple-system, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="-1"
    fill="#38bdf8"
    opacity="0.18"
    filter="url(#nameGlow)"
  >Soumya Chakraborty</text>

  <!-- Main name -->
  <text
    x="450" y="86"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Segoe UI', -apple-system, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="-1"
    fill="url(#nameGrad)"
  >Soumya Chakraborty</text>

  <!-- Thin divider line under name -->
  <line x1="300" y1="98" x2="600" y2="98" stroke="url(#lineGrad)" stroke-width="0.8" opacity="0.6"/>

  <!-- Tagline -->
  <text
    x="450" y="122"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace"
    font-size="13"
    font-weight="400"
    letter-spacing="3"
    fill="#64748b"
  >FULL-STACK ENGINEER  ·  WEST BENGAL, INDIA</text>

  <!-- Bottom accent line -->
  <rect x="0" y="158" width="900" height="2" fill="url(#lineGrad)"/>
</svg>
