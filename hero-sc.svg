<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320"
     role="img" aria-label="Soumya Chakraborty — cinematic monogram, S C, 2026 director's cut"
     text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <title>Soumya Chakraborty — S C monogram</title>
  <style>text{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}</style>

  <defs>
    <linearGradient id="gBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e14"/><stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="gKeyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b03a45"/>
      <stop offset="0.55" stop-color="#d8a63f"/>
      <stop offset="1" stop-color="#7c5f24"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d489"/><stop offset="1" stop-color="#d8a63f"/>
    </linearGradient>
    <linearGradient id="gGoldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8a63f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2d489"/><stop offset="1" stop-color="#d8a63f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gCrimline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b03a45" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4606c"/><stop offset="1" stop-color="#b03a45" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gPool" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#d8a63f" stop-opacity="0.09"/><stop offset="1" stop-color="#d8a63f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8a63f" stop-opacity="0.10"/><stop offset="1" stop-color="#d8a63f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gVig" cx="0.5" cy="0.44" r="0.85">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>
    <rect id="sprocket" width="7" height="11" rx="2.2" fill="#101018" stroke="#2e2e3a" stroke-width="0.75"/>
    <filter id="fMono" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#d8a63f" flood-opacity="0.28"/>
    </filter>
    <filter id="fName" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d8a63f" flood-opacity="0.14"/>
    </filter>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="859" height="319" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0.5" y="0.5" width="859" height="319" fill="url(#gBase)"/>
    <!-- left cinematic keyline (crimson -> gold) -->
    <rect x="0" y="0" width="4" height="320" fill="url(#gKeyline)"/>
    <!-- cinematic spotlight seating the monogram -->
    <rect x="0" y="0" width="860" height="320" fill="url(#gPool)"/>

    <!-- film-slate chrome bar -->
    <rect x="0" y="0" width="860" height="34" fill="#14141b"/>
    <line x1="0" y1="34" x2="860" y2="34" stroke="#2a2a34" stroke-width="1"/>
    <circle cx="20" cy="17" r="3" fill="#d8a63f"/>
    <circle cx="32" cy="17" r="3" fill="#b03a45"/>
    <circle cx="44" cy="17" r="3" fill="#6b7f9c"/>
    <text x="60" y="21" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="0.4" fill="#6a6a75">soumyachk101</text>
    <text x="430" y="21" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace"
          font-size="11" letter-spacing="1.6" fill="#9a9488">2026 · DIRECTOR&#8217;S CUT</text>
    <text x="828" y="21" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="0.4" fill="#6a6a75">KOLKATA · IN</text>

    <!-- soft halo seating the monogram -->
    <ellipse cx="430" cy="144" rx="240" ry="130" fill="url(#gHalo)"/>

    <!-- 35mm sprocket strips (left + right) -->
    <g opacity="0.55">
      <use href="#sprocket" x="15" y="52"/><use href="#sprocket" x="15" y="76"/><use href="#sprocket" x="15" y="100"/><use href="#sprocket" x="15" y="124"/><use href="#sprocket" x="15" y="148"/><use href="#sprocket" x="15" y="172"/><use href="#sprocket" x="15" y="196"/><use href="#sprocket" x="15" y="220"/><use href="#sprocket" x="15" y="244"/><use href="#sprocket" x="15" y="268"/>
      <use href="#sprocket" x="838" y="52"/><use href="#sprocket" x="838" y="76"/><use href="#sprocket" x="838" y="100"/><use href="#sprocket" x="838" y="124"/><use href="#sprocket" x="838" y="148"/><use href="#sprocket" x="838" y="172"/><use href="#sprocket" x="838" y="196"/><use href="#sprocket" x="838" y="220"/><use href="#sprocket" x="838" y="244"/><use href="#sprocket" x="838" y="268"/>
    </g>

    <!-- the star: ASCII S C monogram -->
    <g font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace"
       font-size="18" font-weight="800" fill="url(#gGold)" filter="url(#fMono)">
      <text x="430" y="72"  text-anchor="middle">██████      █████</text>
      <text x="430" y="90"  text-anchor="middle">█            █    </text>
      <text x="430" y="108" text-anchor="middle">█            █    </text>
      <text x="430" y="126" text-anchor="middle">████         █    </text>
      <text x="430" y="144" text-anchor="middle">   █         █    </text>
      <text x="430" y="162" text-anchor="middle">   █         █    </text>
      <text x="430" y="180" text-anchor="middle">   █         █    </text>
      <text x="430" y="198" text-anchor="middle">████         █    </text>
      <text x="430" y="216" text-anchor="middle">██████      █████</text>
    </g>

    <!-- name + gold rule -->
    <text x="430" y="252" text-anchor="middle"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="30" font-weight="700" letter-spacing="0.5" fill="#ece4d4"
          filter="url(#fName)">Soumya Chakraborty</text>
    <rect x="310" y="262" width="240" height="2" rx="1" fill="url(#gGoldline)"/>

    <!-- tagline -->
    <text x="430" y="282" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace"
          font-size="11.5" letter-spacing="0.5" fill="#9a9488"><tspan fill="#f2d489">systems</tspan><tspan fill="#3a3a46"> · </tspan><tspan fill="#ece4d4">ai runtimes</tspan><tspan fill="#3a3a46"> · </tspan><tspan fill="#ece4d4">devtools</tspan></text>

    <!-- cinematic vignette (very subtle, edges only) -->
    <rect x="0.5" y="0.5" width="859" height="319" fill="url(#gVig)"/>
    <text x="836" y="290" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace"
          font-size="9" letter-spacing="1" fill="#6a6a75">R. 1</text>

    <!-- bottom status -->
    <circle cx="34" cy="299" r="3" fill="#b03a45"/>
    <text x="46" y="303" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="0.4"><tspan fill="#6a6a75">now: </tspan><tspan fill="#d4606c">open to internships &amp; collaboration</tspan></text>
    <text x="820" y="303" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="0.4" fill="#6a6a75">Kolkata · UTC+5:30</text>
  </g>

  <!-- sharp outer frame -->
  <rect x="0.5" y="0.5" width="859" height="319" rx="10" fill="none" stroke="#2a2a34" stroke-width="1"/>
</svg>
