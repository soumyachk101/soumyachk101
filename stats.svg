<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" role="img" aria-label="Soumya Chakraborty — GitHub stats: 1,458 commits, 24 stars, 153 PRs, rank A++">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="500" height="200" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <text x="22" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" fill="#38bdf8">⚡ Soumya Chakraborty — GitHub Stats</text>
  <line x1="22" y1="46" x2="478" y2="46" stroke="url(#accent)" stroke-width="2"/>

  <!-- Stat columns -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="22"  y="78" font-size="12" fill="#94a3b8" font-weight="500">Total Commits</text>
    <text x="22"  y="108" font-size="26" font-weight="800" fill="#f0f6fc">1,458</text>

    <text x="148" y="78" font-size="12" fill="#94a3b8" font-weight="500">Stars Earned</text>
    <text x="148" y="108" font-size="26" font-weight="800" fill="#f0f6fc">24</text>

    <text x="260" y="78" font-size="12" fill="#94a3b8" font-weight="500">Pull Requests</text>
    <text x="260" y="108" font-size="26" font-weight="800" fill="#f0f6fc">153</text>
  </g>

  <!-- Footer line: contributions + repos -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="22" y="148" font-size="12" fill="#94a3b8" font-weight="500">Contributed to (last year)</text>
    <text x="22" y="172" font-size="18" font-weight="700" fill="#c9d1d9">4 repos</text>

    <text x="200" y="148" font-size="12" fill="#94a3b8" font-weight="500">Issues opened</text>
    <text x="200" y="172" font-size="18" font-weight="700" fill="#c9d1d9">8</text>
  </g>

  <!-- A++ rank badge (right side) -->
  <g transform="translate(388,108)" filter="url(#glow)">
    <circle cx="44" cy="44" r="42" fill="url(#badge)" stroke="#38bdf8" stroke-width="2"/>
    <text x="44" y="55" text-anchor="middle"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-1">A++</text>
  </g>
</svg>
